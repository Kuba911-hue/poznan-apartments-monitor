<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Ceny - Poznań Apartments</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --primary: #2563eb; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 24px; background: var(--bg); color: var(--text-main); }
        .container { max-width: 1100px; margin: 0 auto; }
        header { margin-bottom: 24px; text-align: center; }
        h1 { font-size: 26px; font-weight: 700; margin: 0 0 6px 0; }
        .control-panel { background: var(--card-bg); padding: 18px 24px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        select { padding: 10px 14px; font-size: 15px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--card-bg); padding: 18px 20px; border-radius: 12px; border: 1px solid var(--border); }
        .stat-title { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--primary); }
        .main-card { background: var(--card-bg); padding: 24px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 24px; }
        .chart-box { position: relative; height: 420px; width: 100%; }
        .debug-console { background: #1e293b; color: #e2e8f0; padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-top: 24px; font-family: 'Courier New', monospace; font-size: 12px; max-height: 250px; overflow-y: auto; }
        .debug-log { display: block; margin: 2px 0; }
        .debug-error { color: #f87171; }
        .debug-success { color: #86efac; }
        .debug-info { color: #93c5fd; }
        .debug-warning { color: #fbbf24; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Monitor Ceny Poznań Apartments</h1>
            <p style="color: var(--text-muted); margin:0;">Automatyczne śledzenie stawek</p>
        </header>

        <div class="control-panel">
            <div>
                <label for="terminSelect" style="font-weight:600; margin-right:8px;">Wybierz termin:</label>
                <select id="terminSelect" onchange="aktualizujStrone()"></select>
            </div>
            <div id="lastUpdate" style="font-size: 13px; color: var(--text-muted);"></div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Najniższa cena</div>
                <div class="stat-value" id="minPrice">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Najtańszy apartament</div>
                <div class="stat-value" id="minRoom" style="font-size: 15px; color: var(--text-main); font-weight: 600;">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Liczba odczytów</div>
                <div class="stat-value" id="totalChecks" style="color: var(--text-main);">-</div>
            </div>
        </div>

        <div class="main-card">
            <div style="font-size: 16px; font-weight: 600; margin-bottom: 20px;">📈 Wykres zmian cen</div>
            <div class="chart-box">
                <canvas id="priceChart"></canvas>
            </div>
        </div>

        <div class="debug-console" id="debugConsole"></div>
    </div>

    <script>
        let historiaData = [];
        let myChart = null;

        function addDebugLog(msg, type = 'info') {
            const debugConsole = document.getElementById('debugConsole');
            const logEntry = document.createElement('div');
            logEntry.className = `debug-log debug-${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            debugConsole.appendChild(logEntry);
            debugConsole.scrollTop = debugConsole.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${msg}`);
        }

        async function wczytajDane() {
            try {
                addDebugLog('Ładowanie historia.json...', 'info');
                const res = await fetch('historia.json');
                
                if (!res.ok) {
                    addDebugLog(`❌ Błąd HTTP ${res.status}: ${res.statusText} - Plik historia.json nie istnieje lub jest niedostępny`, 'error');
                    addDebugLog('💡 Rozwiązanie: Uruchom monitor.py aby wygenerować historia.json', 'warning');
                    throw new Error(`HTTP ${res.status}`);
                }

                const rawData = await res.json();
                addDebugLog(`✓ Załadowano surowe dane`, 'success');
                addDebugLog(`Typ danych: ${typeof rawData}, Czy tablica: ${Array.isArray(rawData)}`, 'info');

                // Validacja i filtrowanie danych
                if (!Array.isArray(rawData)) {
                    addDebugLog('❌ Dane nie są tablicą!', 'error');
                    return;
                }

                historiaData = rawData.filter((entry, idx) => {
                    if (!entry) {
                        addDebugLog(`⚠️ Wpis ${idx} jest null/undefined`, 'warning');
                        return false;
                    }
                    if (!entry.dane) {
                        addDebugLog(`⚠️ Wpis ${idx} nie ma pola 'dane' - pomijam`, 'warning');
                        return false;
                    }
                    if (!Array.isArray(entry.dane)) {
                        addDebugLog(`⚠️ Wpis ${idx}: pole 'dane' nie jest tablicą - pomijam`, 'warning');
                        return false;
                    }
                    return true;
                });

                addDebugLog(`✓ Po filtracji: ${historiaData.length} wpisów (z ${rawData.length})`, 'success');
                
                if (historiaData.length === 0) {
                    addDebugLog('❌ Brak ważnych wpisów po filtracji!', 'error');
                    addDebugLog('Sprawdź strukturę historia.json', 'warning');
                    return;
                }
                
                // Debug: wyświetl strukturę pierwszego wpisu
                if (historiaData.length > 0) {
                    addDebugLog(`Struktura pierwszego wpisu: ${JSON.stringify(historiaData[0]).substring(0, 120)}...`, 'info');
                }
                
                const terminySet = new Set();
                historiaData.forEach((entry, entryIdx) => {
                    if (entry.dane && Array.isArray(entry.dane)) {
                        entry.dane.forEach(item => {
                            if (item.termin) {
                                terminySet.add(item.termin);
                            }
                        });
                    }
                });

                addDebugLog(`✓ Znaleziono ${terminySet.size} unique terminów`, 'success');
                
                if (terminySet.size === 0) {
                    addDebugLog('❌ Brak terminów w danych!', 'error');
                    return;
                }

                const select = document.getElementById('terminSelect');
                select.innerHTML = '';
                Array.from(terminySet).sort().forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t;
                    opt.textContent = t;
                    select.appendChild(opt);
                });

                addDebugLog(`✓ Zapełniono dropdown ${terminySet.size} terminami`, 'success');

                if (historiaData.length > 0) {
                    document.getElementById('lastUpdate').textContent = 'Ostatnia aktualizacja: ' + historiaData[historiaData.length - 1].timestamp;
                }

                aktualizujStrone();
            } catch (e) {
                addDebugLog(`❌ Błąd ładowania: ${e.message}`, 'error');
                addDebugLog(`Stack: ${e.stack}`, 'error');
                console.error("Błąd ładowania danych", e);
            }
        }

        function aktualizujStrone() {
            const wybranyTermin = document.getElementById('terminSelect').value;
            if (!wybranyTermin) {
                addDebugLog('⚠️ Nie wybrano terminu', 'warning');
                return;
            }
            
            addDebugLog(`Wybrany termin: "${wybranyTermin}"`, 'info');
            
            const czasy = [];
            const pokojeMap = {};

            let lowestPrice = Infinity;
            let lowestRoomName = "-";

            historiaData.forEach((entry, entryIdx) => {
                if (!entry.dane || !Array.isArray(entry.dane)) {
                    return;
                }
                
                const daneTerminu = entry.dane.find(d => d.termin === wybranyTermin);
                if (daneTerminu) {
                    czasy.push(entry.timestamp);
                    
                    if (daneTerminu.pokoje && Array.isArray(daneTerminu.pokoje)) {
                        addDebugLog(`Wpis ${entryIdx}: znaleziono ${daneTerminu.pokoje.length} pokoi`, 'info');
                        
                        daneTerminu.pokoje.forEach(p => {
                            if (!p.nazwa || !p.cena) {
                                addDebugLog(`⚠️ Pokój bez nazwy lub ceny: ${JSON.stringify(p)}`, 'warning');
                                return;
                            }
                            
                            if (!pokojeMap[p.nazwa]) pokojeMap[p.nazwa] = [];
                            const kwota = parseFloat(p.cena.replace(/[^0-9,.]/g, '').replace(',', '.'));
                            pokojeMap[p.nazwa].push(kwota || null);

                            if (kwota && kwota < lowestPrice) {
                                lowestPrice = kwota;
                                lowestRoomName = p.nazwa;
                            }
                        });
                    }
                }
            });

            addDebugLog(`✓ Zebrano ${czasy.length} czasów i ${Object.keys(pokojeMap).length} pokoi`, 'success');

            document.getElementById('minPrice').textContent = lowestPrice !== Infinity ? lowestPrice.toFixed(2) + ' zł' : '-';
            document.getElementById('minRoom').textContent = lowestRoomName;
            document.getElementById('totalChecks').textContent = czasy.length;

            const colors = ['#2563eb', '#059669', '#d97706', '#dc2626', '#7c3aed', '#0891b2', '#4b5563'];
            const datasets = Object.keys(pokojeMap).map((nazwa, idx) => ({
                label: nazwa,
                data: pokojeMap[nazwa],
                borderColor: colors[idx % colors.length],
                backgroundColor: colors[idx % colors.length],
                borderWidth: 2,
                pointRadius: 4,
                fill: false,
                tension: 0.15
            }));

            if (myChart) myChart.destroy();
            const ctx = document.getElementById('priceChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: czasy, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: { grid: { color: '#f1f5f9' }, title: { display: true, text: 'Cena (PLN)' } },
                        x: { grid: { display: false }, title: { display: true, text: 'Data i godzina sprawdzania' } }
                    }
                }
            });
            
            addDebugLog('✓ Strona zaktualizowana', 'success');
        }

        wczytajDane();
    </script>
</body>
</html>
