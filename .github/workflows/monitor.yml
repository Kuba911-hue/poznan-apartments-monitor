name: Automatyczny Monitor Cennika

on:
  schedule:
    # Uruchamia skrypt co 3 godziny (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zaleznosci Pythona
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalacja przeglądarki Playwright
        run: |
          npx playwright install-deps
          playwright install chromium

      - name: Uruchomienie bota
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor.py
