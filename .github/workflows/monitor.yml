name: Monitor Cen Deluxe

on:
  schedule:
    # Uruchamianie 4 razy dziennie: o 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Pozwala odpalić ręcznie jednym kliknięciem

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zaleznosci i przegladarki
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Uruchomienie skryptu sprawdzajacego
        run: python scraper.py

      - name: Zapisanie zmian do pliku w repozytorium (Git Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ceny_deluxe.txt
          git commit -m "Automatyczna aktualizacja cen [skip ci]" || exit 0
          git push
