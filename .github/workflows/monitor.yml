name: Monitor Cen Deluxe

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zaleznosci
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Uruchomienie skryptu sprawdzajacego
        run: python scraper.py

      - name: Zapisanie zmian w repozytorium
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dane.json || true
          git commit -m "Aktualizacja cen i strony HTML [skip ci]" || exit 0
          git push origin main
