name: Automatyczny Monitor Cennika

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zaleznosci Pythona
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalacja przeglądarki Playwright
        run: |
          npx playwright install-deps
          playwright install chromium

      - name: Uruchomienie bota
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TZ: Europe/Warsaw
        run: python monitor.py

      - name: Zapis historii i strony do GitHuba
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git pull origin main --rebase || true
          git add historia.json index.html
          git commit -m "Aktualizacja historii cen" || exit 0
          git push
